  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#333333" x="790.0" y="109.0" text-anchor="middle">outer ring fixed;  inner ring turns at ω</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="456.0" text-anchor="start">Each ball entering the defect delivers one Hertz impulse: F_n = 1.143 m_b^0.6 K^0.4 v^1.2 over t_c = 3.128 m_b^0.4 K^-0.4 v^-0.2, at f_imp = Z·c_rel·ω/2π.</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="473.0" text-anchor="start">phi_fault is 45° BY DESIGN — off both sensor axes — so a single-channel measurement cannot miss the fault by being mounted orthogonal to it (§5.2, Q4).</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="490.0" text-anchor="start">The defect is the only time-varying source in the model: no torque ripple, no mesh, and the healthy control run has the same rig with useFault = false.</text>

  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#333333" x="656.0" y="146.0" text-anchor="start">support2/3/4.useLocalResonance — resonant branch</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="434.0" text-anchor="start">The KPI is the RMS RATIO simulated/measured per bearing, over a settled 300 ms window with the startup transient excluded (per-bearing margin).</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="451.0" text-anchor="start">Bearings 2–4 have no fault of their own, so everything they see has travelled through the shaft from bearing1 — which makes the ratio a test of the load path, not of the impulse.</text>
  <text font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#444444" x="16.0" y="468.0" text-anchor="start">Nothing here is a measured stiffness: every parameter calibrated was an engineering placeholder beforehand, and the report says so rather than presenting it as identification.</text>
